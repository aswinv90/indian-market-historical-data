name: Daily Stock Price Update (NSE & BSE)

on:
  schedule:
    # Runs every day at 15:45 UTC = 09:15 PM IST
    - cron: '45 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if session was an Indian Market Working Day
        id: market_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing update."
            echo "is_open=true" >> $GITHUB_OUTPUT
          else
            python scripts/check_market_day.py
          fi

      - name: Run daily stock update (with Circuit Breaker)
        if: steps.market_check.outputs.is_open == 'true'
        run: python scripts/update_stocks.py

      - name: Verify data coverage
        if: steps.market_check.outputs.is_open == 'true'
        run: python scripts/verify_data.py --stale-days 2 || true

      - name: Commit and push updated stock data
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/NSE/ data/BSE/ stock_list_nse.csv stock_list_bse.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore(stocks): daily stock price update $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit for Stocks."
          fi
