name: Daily Market Update (Stocks, Gold & Silver)

on:
  schedule:
    # Runs every day at 02:00 UTC = 07:30 AM IST
    # Evaluates whether the preceding session was an active market day (including weekend Muhurat Trading)
    - cron: '0 2 * * *'

  workflow_dispatch:          # Allow manual trigger from GitHub UI

permissions:
  contents: write             # Needed to commit updated Parquet files

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # Safety cap; ~7000 stocks should finish in ~30–60 min

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if previous trading session was an Indian Market Working Day
        id: market_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing update."
          else
            python scripts/check_market_day.py
          fi

      - name: Run daily stock update
        run: python scripts/update_stocks.py

      - name: Run daily commodities update (Gold & Silver)
        run: python scripts/update_commodities.py

      - name: Verify data coverage
        run: python scripts/verify_data.py --stale-days 2 || true
        # '|| true' prevents CI failure on missing stocks during bootstrap;
        # remove it once the full bootstrap is complete.

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ stock_list_nse.csv stock_list_bse.csv
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
          git push
