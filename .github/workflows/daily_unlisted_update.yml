name: Daily Unlisted Shares Check & Update

on:
  schedule:
    # Runs every day at 13:28 UTC = 06:58 PM IST
    - cron: '28 13 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-unlisted:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect and verify unlisted shares dataset
        run: python scripts/update_unlisted.py

      - name: Commit and push unlisted data if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/UNLISTED/
          if ! git diff --cached --quiet; then
            git commit -m "chore(unlisted): daily unlisted share valuation update $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit for Unlisted Shares."
          fi
