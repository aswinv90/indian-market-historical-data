name: Daily Commodities Update (Gold & Silver)

on:
  schedule:
    # Runs every day at 15:35 UTC = 09:05 PM IST
    - cron: '35 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-commodities:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if session was an Indian Market Working Day
        id: market_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing update."
            echo "is_open=true" >> $GITHUB_OUTPUT
          else
            python scripts/check_market_day.py
          fi

      - name: Run daily commodities update (Gold & Silver)
        if: steps.market_check.outputs.is_open == 'true'
        run: python scripts/update_commodities.py

      - name: Commit and push updated commodities data
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/COMMODITIES/
          if ! git diff --cached --quiet; then
            git commit -m "chore(commodities): daily gold and silver update $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit for Commodities."
          fi
